# ===========================================
# ST-Link 配置：STM32G474CBT6
# 说明：原文件用的是 DAPLink（adapter driver cmsis-dap），
#       现改为 ST-Link/V2、V2-1、V3（OpenOCD 的 st-link 驱动，DAP 直连）。
#       文件名保持不变，避免 CLion 运行配置里引用的路径失效。
# ===========================================

# 调试器：ST-Link（VID_0483 / PID_3742、3744、3748、374b...）
source [find interface/stlink.cfg]

# 传输协议：SWD（2 线制）
transport select swd

# 手动指定 Flash 大小
# STM32G474CBT6 = 128 KB = 0x20000
set FLASH_SIZE 0x20000

# 加载 STM32G4 系列目标芯片配置
source [find target/stm32g4x.cfg]

# SWD 通信速度：8 MHz；若杜邦线较长/不稳定，降到 2000
adapter speed 8000

# 显式固定 Live Watch 插件要连的 Tcl RPC 端口（默认就是 6666）
tcl port 6666