# Alternative ST-Link driver for comparison with the DAP-direct configuration.
# HLA is provided by this installed OpenOCD version, but is deprecated upstream.
source [find interface/stlink-hla.cfg]
transport select hla_swd
set FLASH_SIZE 0x20000
source [find target/stm32g4x.cfg]
reset_config none
adapter speed 480
tcl port 6666
bindto 127.0.0.1
