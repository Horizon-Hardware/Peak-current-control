# Select this file in the CLion OpenOCD Download & Run configuration.
# It replaces neither the existing project configuration nor the flashed firmware.
source [find interface/stlink.cfg]
transport select swd
set FLASH_SIZE 0x20000
source [find target/stm32g4x.cfg]
reset_config none
# Conservative SWD clock while investigating read failures under power-stage load.
# This is the debug link speed; MCU and PWM clocks are unchanged.
# 480 kHz is an exact supported setting on the connected ST-Link.
adapter speed 480
tcl port 6666
# Bind debug services to the local computer only.
bindto 127.0.0.1
